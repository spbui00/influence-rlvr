[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "influence-rlvr"
version = "0.1.0"
requires-python = ">=3.10"
# Loose lower bounds only, so cluster-provided wheels (e.g. Alliance
# torch/transformers/datasets +computecanada builds) satisfy them without
# conflict. torchvision/torchaudio are intentionally absent — unused here.
dependencies = [
    "torch>=2.5",
    "transformers>=4.56",
    "peft>=0.14",
    "trl>=0.17",
    "datasets>=2.21",
    "accelerate>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "requests>=2.32.5",
    "scipy>=1.10",
]

[project.optional-dependencies]
vllm = [
    "vllm==0.11.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[tool.setuptools.packages.find]
where = ["."]
include = ["influence_rlvr*", "analysis*"]
